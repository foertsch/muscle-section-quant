name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
      - name: Install
        run: uv sync --frozen
      # R for the R tests (tests/test_r.py) and the PSR demo's figures: public Posit Package Manager binaries
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - name: System libraries for the R packages (ragg and its dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libfribidi-dev libpng-dev libtiff-dev libjpeg-dev libxml2-dev
      - name: R packages
        run: Rscript -e 'install.packages(c("testthat", "ggplot2", "dplyr", "readr", "multcomp", "tidyr", "ragg"))'
      - name: Tests (synthetic data; no Cellpose weights, no GPU)
        run: uv run pytest -q
      - name: Demo
        run: uv run python demo/run_demo.py
      - name: PSR demo
        run: uv run python demo/run_psr_demo.py

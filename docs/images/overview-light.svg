<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 486" width="920" height="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">What muscle-section-quant does</title>
<desc id="desc">Whole-section scans go through a shared core (tissue, fiber segmentation, run records) into three assays: dystrophin (released in v0.1), fibrosis (released in v0.2) and necrosis (planned for v1.0). Each assay gives tables, figures and interactive reports per fiber, section and animal.</desc>
<rect x="20" y="20" width="880" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="460" y="42" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Whole-section scans</text>
<text x="460" y="61" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="middle">Nikon ND2, immunofluorescence or brightfield</text>
<line x1="460" y1="72" x2="460" y2="105" stroke="#59636e" stroke-width="1.5"/><path d="M455,104 L460,112 L465,104 Z" fill="#59636e"/>
<rect x="20" y="112" width="880" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="460" y="134" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Shared core</text>
<text x="460" y="153" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="middle">tissue and main section  ·  fiber segmentation (Cellpose-SAM)  ·  run records</text>
<line x1="160" y1="164" x2="160" y2="213" stroke="#59636e" stroke-width="1.5"/><path d="M155,212 L160,220 L165,212 Z" fill="#59636e"/>
<rect x="20" y="220" width="280" height="158" rx="12" fill="#e6f4ea" stroke="#2f9e57" stroke-width="1.5"/>
<text x="38" y="252" font-size="19" font-weight="700" fill="#1a7f37" text-anchor="start">Dystrophin</text>
<text x="38" y="274" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="start">Immunofluorescence</text>
<rect x="243.2" y="236" width="40.8" height="22" rx="11" fill="#2f9e57"/>
<text x="263.6" y="251.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">v0.1</text>
<text x="38" y="306" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">Membrane dystrophin per fiber,</text>
<text x="38" y="325" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">called against untreated controls</text>
<line x1="38" y1="338" x2="282" y2="338" stroke="#2f9e57" stroke-opacity="0.45"/>
<text x="38" y="361" font-size="15" font-weight="600" fill="#1a7f37" text-anchor="start">% positive fibers</text>
<line x1="160" y1="378" x2="160" y2="411" stroke="#59636e" stroke-width="1.5"/><path d="M155,410 L160,418 L165,410 Z" fill="#59636e"/>
<line x1="460" y1="164" x2="460" y2="213" stroke="#59636e" stroke-width="1.5"/><path d="M455,212 L460,220 L465,212 Z" fill="#59636e"/>
<rect x="320" y="220" width="280" height="158" rx="12" fill="#fdecea" stroke="#d1453b" stroke-width="1.5"/>
<text x="338" y="252" font-size="19" font-weight="700" fill="#b42318" text-anchor="start">Fibrosis</text>
<text x="338" y="274" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="start">Picrosirius red</text>
<rect x="543.2" y="236" width="40.8" height="22" rx="11" fill="#d1453b"/>
<text x="563.6" y="251.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">v0.2</text>
<text x="338" y="306" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">Collagen outside the fiber</text>
<text x="338" y="325" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">outlines, across the main section</text>
<line x1="338" y1="338" x2="582" y2="338" stroke="#d1453b" stroke-opacity="0.45"/>
<text x="338" y="361" font-size="15" font-weight="600" fill="#b42318" text-anchor="start">% collagen outside fibers</text>
<line x1="460" y1="378" x2="460" y2="411" stroke="#59636e" stroke-width="1.5"/><path d="M455,410 L460,418 L465,410 Z" fill="#59636e"/>
<line x1="760" y1="164" x2="760" y2="213" stroke="#59636e" stroke-width="1.5"/><path d="M755,212 L760,220 L765,212 Z" fill="#59636e"/>
<rect x="620" y="220" width="280" height="158" rx="12" fill="#f3e8f8" stroke="#9a4fc0" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="638" y="252" font-size="19" font-weight="700" fill="#7b2fa3" text-anchor="start">Necrosis</text>
<text x="638" y="274" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="start">Immunofluorescence on laminin</text>
<rect x="778.4" y="236" width="105.6" height="22" rx="11" fill="none" stroke="#9a4fc0" stroke-dasharray="4 3"/>
<text x="831.2" y="251.5" font-size="12.5" font-weight="600" fill="#7b2fa3" text-anchor="middle">planned, v1.0</text>
<text x="638" y="306" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">Necrosis stain inside each fiber,</text>
<text x="638" y="325" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">called against control animals</text>
<line x1="638" y1="338" x2="882" y2="338" stroke="#9a4fc0" stroke-opacity="0.45"/>
<text x="638" y="361" font-size="15" font-weight="600" fill="#7b2fa3" text-anchor="start">% necrotic fibers</text>
<line x1="760" y1="378" x2="760" y2="411" stroke="#59636e" stroke-width="1.5"/><path d="M755,410 L760,418 L765,410 Z" fill="#59636e"/>
<rect x="20" y="418" width="880" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="460" y="449" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="middle">Tables, figures and interactive reports per fiber, section and animal</text>
</svg>
